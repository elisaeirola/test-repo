<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Elisa's Website</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div>
        <h1>Welcome to my Website!</h1>
        <h2>This page will teach you the basics about heritage management.</h2>
        <h2>But first, here's a joke:</h2>
        <h2 id="joke"></h2>
    </div>
    <div id="content"></div>
    <button onclick="loadMarkdown('page1.md', 'content');"
     style="color: rgb(36, 0, 128); background-color: rgb(40, 138, 199); font-family: Cochin;">
     Open Page 1
    </button>
    <div id="content">
    </div>
</body>
<script>
    async function loadMarkdown(filename, componentId) {
    const response = await fetch(filename);
    const text = await response.text();
    document.getElementById(componentId).innerHTML = marked.parse(text);
    }
    loadMarkdown('my_idea.md', 'content');
</script>
<script>
    async function getJoke(){
    const response = await fetch('https://punapi.rest/jokes/random');
    const data = await response.json();
    document.getElementById("joke").innerHTML = data.joke;
  }
  getJoke();
</script>
</html>
