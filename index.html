<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Elisa's Website</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div>
        <h1>Welcome to Sustainable Heritage Management</h1>
        <h2>This page will teach you the basics about heritage management</h2>
    </div>
    
    <h2>But first, here's a fox to guide you on your way:</h2>
    <img id="fox-image" src="" alt="" style="height: 400px; width: auto;">
   
    <div id="content"></div>

    <button onclick="loadMarkdown('page1.md', 'content');"
     style="color: rgb(36, 0, 128); background-color: rgb(40, 138, 199); font-family: Cochin;">
     Open Digital Technologies in Heritage Management
    </button>
    <div id="content">
    </div>
    <button onclick="loadMarkdown('page2.md', 'content');"
     style="color: rgb(36, 0, 128); background-color: rgb(40, 138, 199); font-family: Cochin;">
     Open Reflection
    </button>
     <div id="content"></div>
     <button onclick="loadMarkdown('my_idea.md', 'content');"
     style="color: rgb(36, 0, 128); background-color: rgb(40, 138, 199); font-family: Cochin;">
     Go Back to Homepage
    </button>
    <div id="content"></div>
    <button onclick="loadMarkdown('references.md', 'content');"
     style="color: rgb(36, 0, 128); background-color: rgb(40, 138, 199); font-family: Cochin;">
     Open References
    </button>
    <div id="content"></div>
</body>
<script>
    async function loadMarkdown(filename, componentId) {
    const response = await fetch(filename);
    const text = await response.text();
    document.getElementById(componentId).innerHTML = marked.parse(text);
    }
    loadMarkdown('my_idea.md', 'content');
</script>
<script>
    async function displayImage(){
    const response = await fetch('https://randomfox.ca/floof/');
    const data = await response.json();
    document.getElementById("fox-image").src = data.image;
  }
  displayImage();
</script>
</html>
