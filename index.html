<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Elisa's Website</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div>
        <h1>Welcome to my Website!</h1>
        <h2>This page will teach you the basics about heritage management.</h2>
        But first, here's a random fun fact for you to enjoy
        <h2 id="fact" style="color: rgb(36, 0, 128); text-align: center; padding-bottom: 20px;"></h2>
    </div>
    <div id="content"></div>
    <button onclick="loadMarkdown('page1.md', 'content'); makeBackgroundBlue();"
     style="color: rgb(36, 0, 128); background-color: rgb(194, 163, 241);"
    >
     Open Page 1
    </button>
    <div id="content">
    </div>
</body>
<script>
    async function loadMarkdown(filename, componentId) {
    const response = await fetch(filename);
    const text = await response.text();
    document.getElementById(componentId).innerHTML = marked.parse(text);
    }
    loadMarkdown('my_idea.md', 'content');
</script>
<script>
    async function getFact(){
    const response = await fetch('https://uselessfacts.jsph.pl/api/v2/facts/random');
    const data = await response.json();
    document.getElementById("fact").innerHTML = data.fact;
  }
  getFact();
</script>
</html>
